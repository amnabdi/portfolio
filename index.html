    <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)" />

    <!-- Resolve the theme before first paint so there is no flash of the wrong
         one. Mirrors the logic in src/hooks/useTheme.js; keep the two in sync. -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem("theme");
                var theme =
                    stored === "light" || stored === "dark"
                        ? stored
                        : window.matchMedia("(prefers-color-scheme: dark)").matches
                            ? "dark"
                            : "light";
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
